<!DOCTYPE html>
<html>
<head>
    <title>Prescription Validator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .eye-section {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .eye-section h2 {
            margin-top: 0;
            color: #333;
        }
        .form-group {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            width: 150px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .valid {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .invalid {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .error-list {
            margin-top: 10px;
        }
        .error-list li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Prescription Validator</h1>
    <p>Enter prescription values to validate them against acceptable ranges.</p>
    
    <div class="eye-section">
        <h2>Left Eye</h2>
        <div class="form-group">
            <label>SPH:</label>
            <input type="number" step="0.25" id="leftSph" placeholder="-20.00 to 20.00">
        </div>
        <div class="form-group">
            <label>CYL:</label>
            <input type="number" step="0.25" id="leftCyl" placeholder="-10.00 to 10.00">
        </div>
        <div class="form-group">
            <label>Axis:</label>
            <input type="number" id="leftAxis" placeholder="0 to 180">
        </div>
    </div>

    <div class="eye-section">
        <h2>Right Eye</h2>
        <div class="form-group">
            <label>SPH:</label>
            <input type="number" step="0.25" id="rightSph" placeholder="-20.00 to 20.00">
        </div>
        <div class="form-group">
            <label>CYL:</label>
            <input type="number" step="0.25" id="rightCyl" placeholder="-10.00 to 10.00">
        </div>
        <div class="form-group">
            <label>Axis:</label>
            <input type="number" id="rightAxis" placeholder="0 to 180">
        </div>
    </div>

    <button onclick="validatePrescription()">Validate Prescription</button>

    <div id="result"></div>

    <script>
        async function validatePrescription() {
            const leftSphVal = document.getElementById('leftSph').value;
            const leftCylVal = document.getElementById('leftCyl').value;
            const leftAxisVal = document.getElementById('leftAxis').value;
            const rightSphVal = document.getElementById('rightSph').value;
            const rightCylVal = document.getElementById('rightCyl').value;
            const rightAxisVal = document.getElementById('rightAxis').value;

            const prescription = {
                leftEye: {
                    sph: leftSphVal === '' ? null : parseFloat(leftSphVal),
                    cyl: leftCylVal === '' ? null : parseFloat(leftCylVal),
                    axis: leftAxisVal === '' ? null : parseInt(leftAxisVal)
                },
                rightEye: {
                    sph: rightSphVal === '' ? null : parseFloat(rightSphVal),
                    cyl: rightCylVal === '' ? null : parseFloat(rightCylVal),
                    axis: rightAxisVal === '' ? null : parseInt(rightAxisVal)
                }
            };

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Validating...';

            try {
                const response = await fetch('/api/prescription/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(prescription)
                });

                const result = await response.json();

                if (result.valid) {
                    resultDiv.className = 'valid';
                    resultDiv.innerHTML = '<strong>✓ Prescription is VALID</strong>';
                } else {
                    resultDiv.className = 'invalid';
                    let errorHtml = '<strong>✗ Prescription is INVALID</strong><ul class="error-list">';
                    result.errors.forEach(error => {
                        errorHtml += '<li>' + error + '</li>';
                    });
                    errorHtml += '</ul>';
                    resultDiv.innerHTML = errorHtml;
                }
            } catch (error) {
                resultDiv.className = 'invalid';
                resultDiv.innerHTML = '<strong>Error:</strong> ' + error.message;
            }
        }
    </script>
</body>
</html>
